name: Verify simulator and pose capture
on:
  pull_request:
  push:
    branches: [main, feature/mediapipe]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vision/requirements.txt
      - name: Prepare virtual display
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes xvfb
          fi
      - name: Build and test simulator
        id: java
        shell: bash
        env:
          NOVA_FX_SMOKE: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: |
          set +e
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a mvn --batch-mode -Dstyle.color=never verify > "$RUNNER_TEMP/maven.log" 2>&1
          else
            mvn --batch-mode -Dstyle.color=never verify > "$RUNNER_TEMP/maven.log" 2>&1
          fi
          build_status=$?
          cat "$RUNNER_TEMP/maven.log"
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'maven.log').read_text()
          errors = [line for line in text.splitlines() if '[ERROR]' in line]
          summary = ' | '.join(errors[:8]) if errors else 'Java build and regression tests passed'
          summary = re.sub(r'\x1b\[[0-9;]*m', '', summary)[:1500]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('summary=' + summary + '\n')
          PY
          exit "$build_status"
      - name: '${{ steps.java.outputs.summary }}'
        if: always()
        run: echo 'See the build step for complete Maven output.'
      - run: python -m pip install -r vision/requirements.txt
      - run: python -c "import cv2, mediapipe; from mediapipe.tasks.python.vision import PoseLandmarker"
      - run: python -m unittest discover -s vision/tests -v
