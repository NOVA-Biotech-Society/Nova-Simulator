name: Verify simulator and pose capture
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vision/requirements.txt
      - name: Prepare virtual display
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes xvfb
          fi
      - name: Build and test simulator
        id: java
        shell: bash
        env:
          NOVA_FX_SMOKE: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: |
          set +e
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a mvn --batch-mode -Dstyle.color=never verify > "$RUNNER_TEMP/maven.log" 2>&1
          else
            mvn --batch-mode -Dstyle.color=never verify > "$RUNNER_TEMP/maven.log" 2>&1
          fi
          build_status=$?
          cat "$RUNNER_TEMP/maven.log"
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'maven.log').read_text()
          errors = [line for line in text.splitlines() if '[ERROR]' in line]
          summary = ' | '.join(errors[:8]) if errors else 'Java build and regression tests passed'
          summary = re.sub(r'\x1b\[[0-9;]*m', '', summary)[:1500]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('summary=' + summary + '\n')
          PY
          exit "$build_status"
      - name: '${{ steps.java.outputs.summary }}'
        if: always()
        run: echo 'See the build step for complete Maven output.'
      - run: python -m pip install -r vision/requirements.txt
      - run: python -c "import cv2, mediapipe; from mediapipe.tasks.python.vision import PoseLandmarker"
      - name: Test pose worker and setup
        id: python
        shell: bash
        run: |
          python - <<'PY'
          import os, unittest
          suite = unittest.defaultTestLoader.discover('vision/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failures = result.failures + result.errors
          summary = ' | '.join(str(test) + ': ' + trace for test, trace in failures)
          summary = ' '.join(summary.split())[-1500:] if failures else 'Python worker and setup tests passed'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('summary=' + summary + '\n')
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: '${{ steps.python.outputs.summary }}'
        if: always() && steps.python.outcome != 'skipped'
        run: echo 'See the Python test step for complete output.'
  python313:
    name: Python 3.13 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: macos-14
            architecture: arm64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: vision/requirements.txt
      - name: Test runtime selection and setup
        run: python -m unittest discover -s vision/tests -v
      - name: Install capture runtime and exercise real inference
        id: capture
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, urllib.request
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'capture313.log'
          code = 0
          with log.open('w', encoding='utf-8') as output:
              try:
                  subprocess.run([sys.executable, 'vision/setup_capture.py'], stdout=output, stderr=subprocess.STDOUT, check=True)
                  fixture = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pose.jpg'
                  with urllib.request.urlopen('https://storage.googleapis.com/mediapipe-assets/pose.jpg', timeout=60) as response:
                      fixture.write_bytes(response.read())
                  subprocess.run([sys.executable, 'vision/smoke_capture.py', '--image', str(fixture)], stdout=output, stderr=subprocess.STDOUT, check=True)
              except Exception as error:
                  output.write('\n' + str(error) + '\n')
                  code = 1
          text = log.read_text(encoding='utf-8', errors='replace')
          print(text)
          summary = ' '.join(text.split())[-1500:] if code else 'Python 3.13 setup, codecs and pose landmarks passed'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('summary=' + summary + '\n')
          raise SystemExit(code)
          PY
      - name: '${{ steps.capture.outputs.summary }}'
        if: always() && steps.capture.outcome != 'skipped'
        run: echo 'See the capture step for complete output.'
